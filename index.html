<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الحضور</title>
<style>
  :root { --main:#2563eb; --bg:#f1f5f9; --text:#0f172a; --err:#dc2626; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; padding:16px;
  }
  .card {
    background:#fff; width:100%; max-width:420px; padding:28px 24px;
    border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.08);
  }
  h1 { font-size:1.4rem; margin:0 0 6px; text-align:center; }
  .sub { text-align:center; color:#64748b; margin:0 0 22px; font-size:.95rem; }
  .step { display:none; }
  .step.active { display:block; }
  label { display:block; margin-bottom:8px; font-weight:600; }
  input {
    width:100%; padding:14px; font-size:1.05rem; border:2px solid #e2e8f0;
    border-radius:10px; outline:none; font-family:inherit;
  }
  input:focus { border-color:var(--main); }
  button {
    width:100%; margin-top:16px; padding:14px; font-size:1.05rem; font-weight:700;
    color:#fff; background:var(--main); border:0; border-radius:10px; cursor:pointer;
    font-family:inherit;
  }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .error { color:var(--err); min-height:1.2em; margin-top:10px; font-size:.9rem; text-align:center; }
  .done { text-align:center; }
  .done .icon { font-size:3rem; }
  .link { background:none; color:var(--main); margin-top:10px; padding:8px; font-weight:600; }
  .dots { display:flex; justify-content:center; gap:8px; margin-bottom:18px; }
  .dots span { width:10px; height:10px; border-radius:50%; background:#cbd5e1; }
  .dots span.on { background:var(--main); }
</style>
</head>
<body>
<div class="card">
  <h1>📋 تسجيل الحضور</h1>
  <p class="sub" id="sub">أدخل اسمك للبدء</p>
  <div class="dots"><span class="on" id="d1"></span><span id="d2"></span></div>

  <!-- الصفحة 1: الاسم -->
  <form class="step active" id="step1" autocomplete="off">
    <label for="name">الاسم الكامل</label>
    <input id="name" type="text" maxlength="60" placeholder="اكتب اسمك هنا" required>
    <button type="submit" id="btn1">التالي</button>
  </form>

  <!-- الصفحة 2: المجموعة -->
  <form class="step" id="step2" autocomplete="off">
    <label for="group">مجموعتك (اختياري)</label>
    <input id="group" type="text" maxlength="40" placeholder="مثال: المجموعة 3">
    <button type="submit" id="btn2">إرسال</button>
  </form>

  <!-- تم -->
  <div class="step done" id="step3">
    <div class="icon">✅</div>
    <h2>تم تسجيل حضورك</h2>
    <p id="summary"></p>
    <button class="link" id="again" type="button">تسجيل تلميذ آخر</button>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let studentName = "";

function show(n) {
  ["step1","step2","step3"].forEach((s,i)=> $(s).classList.toggle("active", i+1===n));
  $("d1").classList.toggle("on", n>=1);
  $("d2").classList.toggle("on", n>=2);
  $("sub").textContent = n===1 ? "أدخل اسمك للبدء" : n===2 ? "الآن اكتب مجموعتك" : "";
  $("error").textContent = "";
}

async function send(payload) {
  const r = await fetch("/api/send", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  if (!r.ok) {
    let msg = "تعذر الإرسال، حاول مرة أخرى";
    try { msg = (await r.json()).error || msg; } catch(e){}
    throw new Error(msg);
  }
}

$("step1").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim();
  if (!name) return;
  $("btn1").disabled = true; $("btn1").textContent = "جاري الإرسال...";
  try {
    await send({ type:"name", name });
    studentName = name;
    show(2);
    $("group").focus();
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("btn1").disabled = false; $("btn1").textContent = "التالي";
  }
});

$("step2").addEventListener("submit", async e => {
  e.preventDefault();
  const group = $("group").value.trim();
  // الاسم أُرسل في الخطوة الأولى؛ إن تُركت المجموعة فارغة ننتهي دون إرسال إضافي
  if (!group) {
    $("summary").textContent = studentName;
    show(3);
    return;
  }
  $("btn2").disabled = true; $("btn2").textContent = "جاري الإرسال...";
  try {
    await send({ type:"group", name:studentName, group });
    $("summary").textContent = studentName + " — " + group;
    show(3);
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("btn2").disabled = false; $("btn2").textContent = "إرسال";
  }
});

$("again").addEventListener("click", () => {
  $("name").value = ""; $("group").value = ""; studentName = "";
  show(1); $("name").focus();
});
</script>
</body>
</html>
