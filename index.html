<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال الاسم</title>
</head>
<body>
  <form id="form">
    <input type="text" id="name" placeholder="اكتب اسمك" required>
    <button type="submit">إرسال</button>
  </form>
  <p id="status"></p>

  <script>
    const BOT_TOKEN = "9195323787:AAHV95AHKtcnAPExfE6PhvtWAUUqiydpJwk";
    const CHAT_ID = "6684879160";

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const status = document.getElementById("status");

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, text: "الاسم: " + name })
        });
        const data = await res.json();
        status.textContent = data.ok ? "تم الإرسال ✅" : "فشل الإرسال ❌";
        if (data.ok) e.target.reset();
      } catch (err) {
        status.textContent = "خطأ في الاتصال ❌";
      }
    });
  </script>
</body>
</html>
